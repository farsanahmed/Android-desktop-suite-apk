name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java 17 or newer verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Keystore ./debug.keystore could not be found after creation."
            exit 1
          fi
          echo "Keystore verified successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Searching in app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension."; exit 1 ;;
          esac
          echo "Verified APK exists and is valid at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="$RUNNER_TEMP/release-asset"
          mkdir -p "$TEMP_DIR"
          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/_/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="app"
          fi
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="$TEMP_DIR/$ASSET_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset at $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Version ==="
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH is invalid or missing."
            exit 1
          fi
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES="This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          GitHub Actions run number: ${{ github.run_number }}
          GitHub Actions run attempt: ${{ github.run_attempt }}
          Source commit SHA: ${{ github.sha }}
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore."

          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$RELEASE_NOTES"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "=== Release Published Successfully ==="
            gh release view "$TAG_NAME" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 Debug APK Released
          - **Release Tag:** \`$TAG_NAME\`
          - **Release Page:** [$RELEASE_URL]($RELEASE_URL)
          - **Download Asset:** \`$ASSET_NAME\`

          You can download the APK directly from the **Assets** section of the release page on your mobile device or computer.
          *(Backup Actions artifact \`app-debug-apk\` is also stored in this workflow run.)*
          EOF
          else
            echo "=== Release Publishing Warning ==="
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK build succeeded and artifact 'app-debug-apk' remains available."

            cat << EOF >> $GITHUB_STEP_SUMMARY
          ### ⚠️ Release Publishing Warning
          - The **debug APK build succeeded** and was verified.
          - GitHub Release publishing encountered an issue or failed.
          - **Backup Artifact Available:** The built APK is safely stored as the Actions artifact **\`app-debug-apk\`** on this workflow run page.
          EOF
          fi
